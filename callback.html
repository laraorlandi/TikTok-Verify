<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lara Orlandi Analytics — Conectado</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 80px auto; text-align: center; }
  code { background: #f0f0f0; padding: 8px 12px; border-radius: 6px; display: inline-block; margin-top: 16px; word-break: break-all; }
</style>
</head>
<body>
  <h1>Conta conectada com sucesso ✅</h1>
  <p>Este é o código de autorização recebido do TikTok:</p>
  <code id="codeBox">carregando...</code>
  <p style="margin-top:24px; color:#666; font-size:0.9em;">
    Este código é trocado por um token de acesso (etapa feita de forma segura, fora do navegador)
    para então consultar as estatísticas da conta @_lara.orlandi.
  </p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    document.getElementById("codeBox").textContent = error
      ? "Erro: " + error
      : (code || "nenhum código recebido");
  </script>
</body>
</html>
